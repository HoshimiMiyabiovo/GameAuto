# 全量回归上 GitHub Actions（2026-11-16）。
# - ci 档：跑 tests/ci_suites.txt 全部 include（2026-11-14 仿真探针定稿），非清单
#   套件以 skip 呈现不假装通过；漂移闸门 test_manifest_covers_all_suites 每片都跑。
# - 三分片并行（GAMEAUTO_TEST_SHARD 按序取模），片间互不拖累（fail-fast: false）。
# - 单套件 600s 超时：CI 机器无 GPU，CUDA OCR e2e 回落 CPU 会明显慢于本机；
#   引擎不可用的套件自带 SKIP 分支，不会假失败。
# - 依赖：requirements.lock 全量冻结（--no-deps 精确复现，与 setup_deps.bat 同口径；
#   GPU 版 onnxruntime 必须保留，CPU 版会让 onnxocr 静默降级），pytest 不在运行时
#   lock 里单独装。pyhuskarui / PySide6<6.9 等版本敏感项均已被 lock 钉死。
# - 仓库 public：标准 Windows runner 免费，全量跑不占分钟配额。
# - 触发：master push / PR 且改动落在代码-测试-模板-模型-依赖清单内；README、docs
#   等纯文档改动不触发（要跑走 workflow_dispatch 手动触发）。
name: regression

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "tests/**"
      - "assets/**"
      - "data/models/**"
      - "requirements.txt"
      - "requirements.lock"
      - "pyproject.toml"
      - ".github/workflows/regression.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "assets/**"
      - "data/models/**"
      - "requirements.txt"
      - "requirements.lock"
      - "pyproject.toml"
      - ".github/workflows/regression.yml"
  workflow_dispatch:

# 同一分支新 push 自动取消旧跑，别在队列里叠罗汉
concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: shard ${{ matrix.shard }}/3
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      GAMEAUTO_TEST_TIER: ci
      GAMEAUTO_TEST_SHARD: ${{ matrix.shard }}/3
      GAMEAUTO_TEST_SUITE_TIMEOUT_SEC: '600'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -r requirements.lock
          pip install pytest

      # flow_configs.json 是 gitignore 的本机实例，CI 只有 example——
      # example 即开箱合法配置，拷贝后 ~14 个读实例配置的套件直接可跑。
      - name: Provision flow_configs.json from example
        run: Copy-Item flow_configs.example.json flow_configs.json

      - name: Run regression (shard ${{ matrix.shard }}/3)
        run: python -m pytest tests/test_suites.py -q
